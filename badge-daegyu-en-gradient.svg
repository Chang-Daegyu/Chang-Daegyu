<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" role="img" aria-labelledby="title desc">
  <title id="title">Chang Daegyu — Backend &amp; AI Developer</title>
  <desc id="desc">Animated GitHub profile hero banner for Chang Daegyu.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0A1024"/>
      <stop offset="1" stop-color="#060914"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="0.23" stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="0.78" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.34" stop-color="#F8FAFC"/>
      <stop offset="0.63" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbB">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8B9BB4" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="nameGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="nameReveal">
      <rect x="206" y="67" width="0" height="58" rx="4">
        <animate attributeName="width" values="0;0;590;590;590;0" keyTimes="0;0.08;0.24;0.78;0.93;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- PANEL -->
  <rect x="1" y="1" width="978" height="238" rx="22" fill="url(#bg)" stroke="#26314E" stroke-width="2"/>
  <rect x="1" y="1" width="978" height="238" rx="22" fill="url(#grid)" opacity="0.82"/>

  <!-- ambient glows -->
  <circle cx="160" cy="102" r="150" fill="url(#orbA)">
    <animate attributeName="r" values="135;165;135" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="828" cy="138" r="155" fill="url(#orbB)">
    <animate attributeName="r" values="150;175;150" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <!-- animated border accent -->
  <path d="M22 2 H958 Q978 2 978 22 V218" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="180 850">
    <animate attributeName="stroke-dashoffset" values="0;-1030" dur="6.5s" repeatCount="indefinite"/>
  </path>

  <!-- metadata -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.4">
    <text x="28" y="29" fill="#8B9BB4">PROFILE://CHANG-DAEGYU</text>
    <circle cx="840" cy="25" r="3.8" fill="#34D399">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="851" y="29" fill="#9CAFC9">SYSTEM ONLINE</text>
  </g>

  <!-- left identity node -->
  <g transform="translate(35 61)">
    <path d="M62 0 L116 31 V93 L62 124 L8 93 V31 Z" fill="#081020" stroke="#6D5CE7" stroke-opacity="0.72" stroke-width="1.5"/>
    <path d="M62 9 L108 35 V89 L62 115 L16 89 V35 Z" fill="none" stroke="#22D3EE" stroke-opacity="0.20"/>
    <circle cx="62" cy="62" r="35" fill="#0D1630" stroke="#A78BFA" stroke-opacity="0.45"/>
    <circle cx="62" cy="62" r="42" fill="none" stroke="#67E8F9" stroke-opacity="0.18" stroke-dasharray="10 8">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 62 62" to="360 62 62" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="73" text-anchor="middle" fill="url(#nameGrad)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="800" letter-spacing="-2">DG</text>
    <circle cx="62" cy="8" r="3" fill="#67E8F9" filter="url(#softGlow)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 62 62" to="360 62 62" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main name / reveal -->
  <text x="205" y="111" fill="#66738C" fill-opacity="0.22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="800" letter-spacing="4.2">CHANG DAEGYU</text>
  <g clip-path="url(#nameReveal)" filter="url(#nameGlow)">
    <text x="205" y="111" fill="url(#nameGrad)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="800" letter-spacing="4.2">CHANG DAEGYU</text>
  </g>

  <!-- moving highlight over name -->
  <rect x="185" y="69" width="125" height="55" fill="url(#scanGrad)" opacity="0.42" transform="skewX(-12)">
    <animate attributeName="x" values="170;760;760" keyTimes="0;0.48;1" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- role -->
  <text x="207" y="143" fill="#A7B5CC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5">BACKEND  ·  AI  ·  DATA  ·  INFRASTRUCTURE</text>

  <!-- signal separator -->
  <g transform="translate(207 160)">
    <rect x="0" y="0" width="642" height="1" fill="#50617B" opacity="0.38"/>
    <rect x="0" y="0" width="112" height="1.5" fill="url(#edge)">
      <animate attributeName="x" values="0;530;0" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- terminal line -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="207" y="190" fill="#67E8F9">&gt;</text>
    <text x="224" y="190" fill="#C7D2E5">build</text>
    <text x="267" y="190" fill="#576780">•</text>
    <text x="282" y="190" fill="#C7D2E5">verify</text>
    <text x="336" y="190" fill="#576780">•</text>
    <text x="351" y="190" fill="#C7D2E5">operate</text>
    <text x="406" y="190" fill="#73839C"> reliable intelligent systems</text>
    <rect x="625" y="179" width="7" height="14" rx="1" fill="#A78BFA">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right HUD -->
  <g transform="translate(835 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <circle cx="42" cy="42" r="40" fill="#07101F" stroke="#233454"/>
    <circle cx="42" cy="42" r="31" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-dasharray="45 14">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 42 42" to="0 42 42" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="42" r="22" fill="none" stroke="#A78BFA" stroke-opacity="0.45" stroke-dasharray="20 10">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 42 42" to="360 42 42" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="42" r="5.5" fill="#67E8F9" filter="url(#softGlow)">
      <animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="102" text-anchor="middle" fill="#7788A5" font-size="8.5" letter-spacing="1.1">AI CORE</text>
  </g>

  <!-- bottom status chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" letter-spacing="1">
    <rect x="207" y="205" width="88" height="19" rx="9.5" fill="#A78BFA" fill-opacity="0.09" stroke="#A78BFA" stroke-opacity="0.28"/>
    <text x="251" y="218" text-anchor="middle" fill="#BFB3F5">BACKEND</text>
    <rect x="303" y="205" width="88" height="19" rx="9.5" fill="#22D3EE" fill-opacity="0.075" stroke="#22D3EE" stroke-opacity="0.25"/>
    <text x="347" y="218" text-anchor="middle" fill="#8CEBF5">AI SYSTEMS</text>
    <rect x="399" y="205" width="88" height="19" rx="9.5" fill="#60A5FA" fill-opacity="0.075" stroke="#60A5FA" stroke-opacity="0.25"/>
    <text x="443" y="218" text-anchor="middle" fill="#9BC5FA">MLOPS</text>
    <rect x="495" y="205" width="88" height="19" rx="9.5" fill="#34D399" fill-opacity="0.06" stroke="#34D399" stroke-opacity="0.22"/>
    <text x="539" y="218" text-anchor="middle" fill="#84E6BE">INFRA</text>
  </g>

  <!-- tiny moving data particles -->
  <g fill="#67E8F9">
    <circle cx="179" cy="52" r="1.4"><animate attributeName="cx" values="179;810;179" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="214" r="1.2"><animate attributeName="cx" values="780;640;780" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/></circle>
  </g>
</svg>