<svg xmlns="http://www.w3.org/2000/svg" width="980" height="292" viewBox="0 0 980 292" role="img" aria-labelledby="title desc">
  <title id="title">Chang Daegyu Professional Certifications</title>
  <desc id="desc">Animated professional certification panel with subtle moving light reflection and sequential card emphasis.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.48" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="0.50" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.66" stop-color="#BFE7FF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#64748B" stroke-opacity="0.032"/>
    </pattern>
    <clipPath id="panelClip"><rect x="1" y="1" width="978" height="290" rx="18"/></clipPath>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="978" height="290" rx="18" fill="url(#bg)" stroke="#263246" stroke-width="2"/>
  <rect x="1" y="1" width="978" height="290" rx="18" fill="url(#grid)"/>

  <text x="32" y="39" fill="url(#headline)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="800" letter-spacing="1">PROFESSIONAL CERTIFICATIONS</text>
  <text x="32" y="59" fill="#728198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2">SECURITY · DATA · SOFTWARE · DATABASE</text>
  <circle cx="856" cy="37" r="4" fill="#34D399" filter="url(#dotGlow)"><animate attributeName="opacity" values="1;.28;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="869" y="41" fill="#8292A7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">5 CERTIFICATIONS</text>
  <rect x="32" y="71" width="916" height="1" fill="#263449"/>

  <!-- Security -->
  <g transform="translate(32 89)">
    <rect width="286" height="79" rx="13" fill="#0B1120" stroke="#6D5CE7" stroke-opacity="0.55"/>
    <rect width="286" height="79" rx="13" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values="0;0.15;0.035;0" keyTimes="0;.10;.32;1" dur="7.2s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="5" height="79" rx="2.5" fill="#8B5CF6"/>
    <g transform="translate(18 18)" fill="none" stroke="#C4B5FD" stroke-width="1.7" stroke-linejoin="round"><path d="M14 0 L27 5 V15 C27 24 21 31 14 35 C7 31 1 24 1 15 V5 Z"/><path d="M8 16l4 4 8-9"/></g>
    <text x="62" y="27" fill="#F1F5F9" font-family="Pretendard,Noto Sans KR,Apple SD Gothic Neo,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">정보보안기사</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.7">INFORMATION SECURITY ENGINEER</text>
    <text x="62" y="65" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2026.08</text>
    <rect x="210" y="49" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/><text x="239" y="61" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>

