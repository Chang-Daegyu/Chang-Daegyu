  <g transform="translate(662 88)">
    <rect width="286" height="78" rx="13" fill="#0B1120" stroke="#34D399" stroke-opacity="0.48"/>
    <rect x="0" y="0" width="5" height="78" rx="2.5" fill="#34D399"/>
    <g transform="translate(18 20)" fill="none" stroke="#86EFAC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2L2 10l8 8M20 2l8 8-8 8"/>
      <path d="M17 0l-4 22"/>
      <rect x="4" y="27" width="22" height="7" rx="2"/>
    </g>
    <text x="62" y="27" fill="#F1F5F9" font-family="Pretendard,Noto Sans KR,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">정보처리기사</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">INFORMATION PROCESSING ENGINEER</text>
    <text x="62" y="64" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2025.09</text>
    <rect x="210" y="48" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="239" y="60" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>

  <!-- card 4: SQLD -->
  <g transform="translate(190 184)">
    <rect width="286" height="78" rx="13" fill="#0B1120" stroke="#F59E0B" stroke-opacity="0.48"/>
    <rect x="0" y="0" width="5" height="78" rx="2.5" fill="#F59E0B"/>
    <g transform="translate(18 18)" fill="none" stroke="#FBBF24" stroke-width="1.6">
      <ellipse cx="15" cy="5" rx="12" ry="5"/>
      <path d="M3 5v22c0 3 5 5 12 5s12-2 12-5V5"/>
      <path d="M3 15c0 3 5 5 12 5s12-2 12-5M3 25c0 3 5 5 12 5s12-2 12-5"/>
    </g>
    <text x="62" y="27" fill="#F1F5F9" font-family="Pretendard,Noto Sans KR,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">SQLD</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">SQL DEVELOPER</text>
    <text x="62" y="64" fill="#FBBF24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2025.09</text>
    <rect x="210" y="48" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="239" y="60" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>

  <!-- card 5: 빅데이터분석기사 -->
  <g transform="translate(504 184)">
    <rect width="286" height="78" rx="13" fill="#0B1120" stroke="#60A5FA" stroke-opacity="0.48"/>
    <rect x="0" y="0" width="5" height="78" rx="2.5" fill="#60A5FA"/>
    <g transform="translate(17 17)" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round">
      <circle cx="6" cy="7" r="4"/><circle cx="25" cy="5" r="4"/><circle cx="15" cy="21" r="4"/><circle cx="29" cy="28" r="4"/><circle cx="4" cy="31" r="4"/>
      <path d="M9 9l12-2M8 10l5 8M18 20l8-12M18 23l8 4M11 23l-5 5"/>
    </g>
    <text x="62" y="27" fill="#F1F5F9" font-family="Pretendard,Noto Sans KR,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">빅데이터분석기사</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">BIG DATA ANALYSIS ENGINEER</text>
    <text x="62" y="64" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2025.07</text>
    <rect x="210" y="48" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="239" y="60" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>
</svg>