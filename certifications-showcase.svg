  <g transform="translate(347 89)">
    <rect width="286" height="79" rx="13" fill="#0B1120" stroke="#22D3EE" stroke-opacity="0.50"/>
    <rect width="286" height="79" rx="13" fill="#22D3EE" opacity="0"><animate attributeName="opacity" values="0;0.13;0.03;0" keyTimes="0;.10;.32;1" dur="7.2s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="5" height="79" rx="2.5" fill="#22D3EE"/>
    <g transform="translate(18 19)" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round"><path d="M2 31V18M10 31V10M18 31V22M26 31V4"/><path d="M0 31H29"/><circle cx="10" cy="10" r="2" fill="#67E8F9"/><circle cx="26" cy="4" r="2" fill="#67E8F9"/></g>
    <text x="62" y="27" fill="#F1F5F9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">ADsP</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.7">ADVANCED DATA ANALYTICS SEMI-PRO</text>
    <text x="62" y="65" fill="#67E8F9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2026.06</text>
    <rect x="210" y="49" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/><text x="239" y="61" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>

