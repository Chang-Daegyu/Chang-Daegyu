<svg xmlns="http://www.w3.org/2000/svg" width="980" height="286" viewBox="0 0 980 286" role="img" aria-labelledby="title desc">
  <title id="title">Chang Daegyu Professional Certifications</title>
  <desc id="desc">Professional certifications for information security, data analysis, software engineering, SQL, and big data analysis.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.45" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#64748B" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="978" height="284" rx="18" fill="url(#bg)" stroke="#263246" stroke-width="2"/>
  <rect x="1" y="1" width="978" height="284" rx="18" fill="url(#grid)"/>

  <!-- header -->
  <text x="32" y="38" fill="url(#headline)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="800" letter-spacing="1">PROFESSIONAL CERTIFICATIONS</text>
  <text x="32" y="58" fill="#728198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2">SECURITY · DATA · SOFTWARE · DATABASE</text>
  <circle cx="862" cy="37" r="4" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
  <text x="875" y="41" fill="#8292A7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">5 CERTIFICATIONS</text>
  <rect x="32" y="70" width="916" height="1" fill="#263449"/>

  <!-- card 1: 정보보안기사 -->
  <g transform="translate(32 88)">
    <rect width="286" height="78" rx="13" fill="#0B1120" stroke="#6D5CE7" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="5" height="78" rx="2.5" fill="#8B5CF6"/>
    <g transform="translate(18 17)" fill="none" stroke="#C4B5FD" stroke-width="1.7" stroke-linejoin="round">
      <path d="M14 0 L27 5 V15 C27 24 21 31 14 35 C7 31 1 24 1 15 V5 Z"/>
      <path d="M8 16l4 4 8-9"/>
    </g>
    <text x="62" y="27" fill="#F1F5F9" font-family="Pretendard,Noto Sans KR,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">정보보안기사</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">INFORMATION SECURITY ENGINEER</text>
    <text x="62" y="64" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2026.08</text>
    <rect x="210" y="48" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="239" y="60" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>

  <!-- card 2: ADsP -->
  <g transform="translate(347 88)">
    <rect width="286" height="78" rx="13" fill="#0B1120" stroke="#22D3EE" stroke-opacity="0.48"/>
    <rect x="0" y="0" width="5" height="78" rx="2.5" fill="#22D3EE"/>
    <g transform="translate(18 18)" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round">
