    <text x="62" y="27" fill="#F1F5F9" font-family="Pretendard,Noto Sans KR,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800">ADsP</text>
    <text x="62" y="45" fill="#8D9CB1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">ADVANCED DATA ANALYTICS SEMI-PRO</text>
    <text x="62" y="64" fill="#67E8F9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">2026.06</text>
    <rect x="210" y="48" width="58" height="18" rx="9" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="239" y="60" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8">CERTIFIED</text>
  </g>

