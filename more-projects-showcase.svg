<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Chang Daegyu — More Projects</title>
  <desc id="desc">Animated project showcase for Smartphone HAR, Air Pollution Forecasting, and AI Library Web App.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="har" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="lib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8B9BB4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="978" height="418" rx="22" fill="url(#bg)" stroke="#26314E" stroke-width="2"/>
  <rect x="1" y="1" width="978" height="418" rx="22" fill="url(#grid)"/>

  <text x="34" y="48" fill="url(#header)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="800" letter-spacing="2">MORE PROJECTS</text>
  <text x="744" y="45" fill="#7E8EA9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">DATA · ML · FULL STACK</text>
  <rect x="34" y="62" width="912" height="1" fill="#2B3A57"/>
  <rect x="34" y="61.5" width="145" height="2" fill="url(#header)">
    <animate attributeName="x" values="34;800;34" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- CARD 1 -->
  <g transform="translate(34 86)">
    <rect width="286" height="270" rx="18" fill="url(#har)" stroke="#B7791F" stroke-opacity="0.7"/>
    <rect x="18" y="18" width="38" height="24" rx="7" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.55"/>
    <text x="37" y="35" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">05</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Smartphone HAR</text>
    <text x="20" y="92" fill="#AAB7CC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">IMU Human Activity Recognition</text>

    <g transform="translate(20 113)">
      <rect width="246" height="48" rx="12" fill="#090F1E" stroke="#6B4D13"/>
      <text x="14" y="19" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10">561 FEATURES</text>
      <text x="14" y="36" fill="#C8D3E4" font-family="ui-monospace, monospace" font-size="10">6 activities · static / dynamic</text>
      <circle cx="226" cy="24" r="5" fill="#F59E0B" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="188" fill="#8090AA" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">RESULT</text>
    <text x="20" y="210" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="13" font-weight="700">RandomForest accuracy 0.98</text>
    <text x="20" y="229" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="10">Hierarchical stage-1 accuracy 1.00</text>

    <text x="20" y="252" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="9">Python · scikit-learn · TensorFlow/Keras</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(347 86)">
    <rect width="286" height="270" rx="18" fill="url(#air)" stroke="#BE455A" stroke-opacity="0.7"/>
    <rect x="18" y="18" width="38" height="24" rx="7" fill="#FB7185" fill-opacity="0.13" stroke="#FB7185" stroke-opacity="0.55"/>
    <text x="37" y="35" text-anchor="middle" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">06</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800">Air Pollution Forecasting</text>
    <text x="20" y="92" fill="#AAB7CC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">One-hour-ahead PM10 prediction</text>

    <g transform="translate(20 113)">
      <rect width="246" height="48" rx="12" fill="#090F1E" stroke="#68313D"/>
      <text x="14" y="19" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="10">2024 TRAIN → 2025 TEST</text>
      <text x="14" y="36" fill="#C8D3E4" font-family="ui-monospace, monospace" font-size="10">air + weather + lag features</text>
      <circle cx="226" cy="24" r="5" fill="#FB7185" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="188" fill="#8090AA" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">BEST RESULT</text>
    <text x="20" y="210" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="13" font-weight="700">Linear Regression  R² 0.9311</text>
    <text x="20" y="229" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="10">MSE 52.40 · PM10 +1h</text>

    <text x="20" y="252" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="9">pandas · scikit-learn · XGBoost</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(660 86)">
    <rect width="286" height="270" rx="18" fill="url(#lib)" stroke="#25896B" stroke-opacity="0.7"/>
    <rect x="18" y="18" width="38" height="24" rx="7" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="37" y="35" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">07</text>
    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">AI Library Web App</text>
    <text x="20" y="92" fill="#AAB7CC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Full-stack personal library management</text>

    <g transform="translate(20 113)">
      <rect width="246" height="48" rx="12" fill="#090F1E" stroke="#245C4C"/>
      <text x="14" y="19" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10">AUTH · BOOK CRUD · AI COVER</text>
      <text x="14" y="36" fill="#C8D3E4" font-family="ui-monospace, monospace" font-size="10">frontend ↔ REST API ↔ database</text>
      <circle cx="226" cy="24" r="5" fill="#34D399" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="188" fill="#8090AA" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">STACK</text>
    <text x="20" y="210" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="12" font-weight="700">React 19 · Vite 7 · Spring Boot</text>
    <text x="20" y="229" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="10">H2 · DALL·E 3 cover generation</text>

    <text x="20" y="252" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="9">AWSfront + AWSback repositories</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <circle cx="35" cy="390" r="3" fill="#34D399"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="47" y="394" fill="#8494AE" letter-spacing="1">PUBLIC REPOSITORY EVIDENCE · VERIFIED PROJECT METRICS · CHANG DAEGYU</text>
    <text x="830" y="394" fill="#67E8F9">BUILD → VERIFY → OPERATE</text>
  </g>
</svg>