<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Chang Daegyu — Additional Engineering Projects</title>
  <desc id="desc">Animated showcase for AgentSpec, AgentOps Control Plane, cryptAnalysis, and AI Library Web App.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.035"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8B9BB4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="978" height="518" rx="22" fill="url(#bg)" stroke="#26314E" stroke-width="2"/>
  <rect x="1" y="1" width="978" height="518" rx="22" fill="url(#grid)"/>

  <!-- header -->
  <text x="34" y="48" fill="url(#headline)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="800" letter-spacing="2">ADDITIONAL ENGINEERING PROJECTS</text>
  <text x="754" y="46" fill="#7F90AB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">VERIFY · ORCHESTRATE · ANALYZE · BUILD</text>
  <rect x="34" y="63" width="912" height="1" fill="#2B3A57"/>
  <rect x="34" y="62.5" width="150" height="2" fill="url(#headline)">
    <animate attributeName="x" values="34;796;34" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- AgentSpec -->
  <g transform="translate(34 87)">
    <rect width="438" height="184" rx="17" fill="url(#purple)" stroke="#7C5CE1" stroke-opacity="0.75"/>
    <rect x="18" y="17" width="34" height="23" rx="7" fill="#8B5CF6" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text x="35" y="33" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="10" font-weight="700">05</text>
    <rect x="335" y="17" width="84" height="23" rx="11" fill="#8B5CF6" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.35"/>
    <text x="377" y="33" text-anchor="middle" fill="#BFAFF5" font-family="ui-monospace, monospace" font-size="9">PRIVATE R&amp;D</text>

    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">AgentSpec</text>
    <text x="20" y="92" fill="#C5CFE0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Evidence-driven verification for AI coding agents</text>

    <g transform="translate(20 108)">
      <rect width="398" height="44" rx="11" fill="#080E1D" stroke="#463A70"/>
      <text x="14" y="18" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="9">FAIL-CLOSED VERDICTS · COMMIT-BOUND EVALUATION</text>
      <text x="14" y="34" fill="#AAB6CA" font-family="ui-monospace, monospace" font-size="9">Git snapshot / compare / protect · adversarial regression tests</text>
      <circle cx="379" cy="22" r="4.5" fill="#A78BFA" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="171" fill="#9FAECD" font-family="ui-monospace, monospace" font-size="9">TypeScript · Node.js · Git internals · Windows Job Object supervision</text>
  </g>

  <!-- AgentOps -->
  <g transform="translate(508 87)">
    <rect width="438" height="184" rx="17" fill="url(#cyan)" stroke="#2999B5" stroke-opacity="0.75"/>
    <rect x="18" y="17" width="34" height="23" rx="7" fill="#22D3EE" fill-opacity="0.12" stroke="#67E8F9" stroke-opacity="0.48"/>
    <text x="35" y="33" text-anchor="middle" fill="#8DEBF4" font-family="ui-monospace, monospace" font-size="10" font-weight="700">06</text>
    <rect x="335" y="17" width="84" height="23" rx="11" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.3"/>
    <text x="377" y="33" text-anchor="middle" fill="#83DDE8" font-family="ui-monospace, monospace" font-size="9">PRIVATE R&amp;D</text>

    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">AgentOps Control Plane</text>
    <text x="20" y="92" fill="#C5CFE0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Work-aware autoscaling for multi-agent execution</text>

    <g transform="translate(20 108)">
      <rect width="398" height="44" rx="11" fill="#080E1D" stroke="#285C69"/>
      <text x="14" y="18" fill="#8DEBF4" font-family="ui-monospace, monospace" font-size="9">CONTROL PLANE ↔ DATA PLANE · WORKER POOL · WATCHDOG</text>
      <text x="14" y="34" fill="#AAB6CA" font-family="ui-monospace, monospace" font-size="9">quality / constraints / demand-aware scaling policies</text>
      <circle cx="379" cy="22" r="4.5" fill="#22D3EE" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="171" fill="#9FAECD" font-family="ui-monospace, monospace" font-size="9">Python · FastAPI · SQLite · Docker · policy-driven runtime</text>
  </g>

  <!-- cryptAnalysis -->
  <g transform="translate(34 293)">
    <rect width="438" height="184" rx="17" fill="url(#red)" stroke="#B74B61" stroke-opacity="0.75"/>
    <rect x="18" y="17" width="34" height="23" rx="7" fill="#FB7185" fill-opacity="0.12" stroke="#FDA4AF" stroke-opacity="0.48"/>
    <text x="35" y="33" text-anchor="middle" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">07</text>
    <rect x="335" y="17" width="84" height="23" rx="11" fill="#FB7185" fill-opacity="0.08" stroke="#FDA4AF" stroke-opacity="0.3"/>
    <text x="377" y="33" text-anchor="middle" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="9">PRIVATE R&amp;D</text>

    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">cryptAnalysis</text>
    <text x="20" y="92" fill="#C5CFE0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Cryptanalysis competition — problems 01 through 08</text>

    <g transform="translate(20 108)">
      <rect width="398" height="44" rx="11" fill="#080E1D" stroke="#693240"/>
      <text x="14" y="18" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="9">TLS AES-GCM · PARTIAL RSA · DUAL_EC_DRBG · REDUCED AES</text>
      <text x="14" y="34" fill="#AAB6CA" font-family="ui-monospace, monospace" font-size="9">reverse engineering · lattice recovery · key / state recovery</text>
      <circle cx="379" cy="22" r="4.5" fill="#FB7185" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="171" fill="#9FAECD" font-family="ui-monospace, monospace" font-size="9">Reproducible problem / solution / report structure for all 8 challenges</text>
  </g>

  <!-- AI Library -->
  <g transform="translate(508 293)">
    <rect width="438" height="184" rx="17" fill="url(#green)" stroke="#2A8B6E" stroke-opacity="0.75"/>
    <rect x="18" y="17" width="34" height="23" rx="7" fill="#34D399" fill-opacity="0.12" stroke="#6EE7B7" stroke-opacity="0.48"/>
    <text x="35" y="33" text-anchor="middle" fill="#86E8C0" font-family="ui-monospace, monospace" font-size="10" font-weight="700">08</text>
    <rect x="349" y="17" width="70" height="23" rx="11" fill="#34D399" fill-opacity="0.08" stroke="#6EE7B7" stroke-opacity="0.3"/>
    <text x="384" y="33" text-anchor="middle" fill="#86E8C0" font-family="ui-monospace, monospace" font-size="9">PUBLIC</text>

    <text x="20" y="70" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">AI Library Web App</text>
    <text x="20" y="92" fill="#C5CFE0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Full-stack personal library management</text>

    <g transform="translate(20 108)">
      <rect width="398" height="44" rx="11" fill="#080E1D" stroke="#285D4C"/>
      <text x="14" y="18" fill="#86E8C0" font-family="ui-monospace, monospace" font-size="9">AUTH · BOOK CRUD · AI-GENERATED COVER</text>
      <text x="14" y="34" fill="#AAB6CA" font-family="ui-monospace, monospace" font-size="9">React client ↔ Spring REST API ↔ H2 database</text>
      <circle cx="379" cy="22" r="4.5" fill="#34D399" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="20" y="171" fill="#9FAECD" font-family="ui-monospace, monospace" font-size="9">React 19 · Vite 7 · Spring Boot · H2 · DALL·E 3</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <circle cx="35" cy="500" r="3" fill="#34D399"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="47" y="504" fill="#8494AE" letter-spacing="1">SELECTED ADDITIONAL WORK · IMPLEMENTATION-SCOPED DESCRIPTIONS · CHANG DAEGYU</text>
    <text x="830" y="504" fill="#67E8F9">BUILD → VERIFY → OPERATE</text>
  </g>
