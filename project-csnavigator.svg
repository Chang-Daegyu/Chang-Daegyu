<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t d">
<title id="t">CS-Navigator</title><desc id="d">Real-time call center copilot interface with STT and AI guidance</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101C"/><stop offset="1" stop-color="#0B1726"/></linearGradient>
 <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#64748B" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="318" rx="20" fill="url(#bg)" stroke="#284D6B" stroke-width="2"/><rect x="1" y="1" width="978" height="318" rx="20" fill="url(#grid)"/>

<text x="30" y="38" fill="#8093A9" font-family="ui-monospace,monospace" font-size="10">AICC / REAL-TIME COPILOT / AI TRAINING</text>
<text x="30" y="79" fill="url(#brand)" font-family="ui-sans-serif,system-ui" font-size="34" font-weight="900">CS-Navigator</text>
<text x="30" y="103" fill="#CAD7E4" font-family="ui-sans-serif,system-ui" font-size="13">Live guidance for customer-service conversations.</text>
<rect x="772" y="24" width="174" height="31" rx="6" fill="#0A1523" stroke="#22D3EE" stroke-opacity=".4"/>
<text x="791" y="43" fill="#8FDCEC" font-family="ui-monospace,monospace" font-size="10">PROJECT WORKSPACE ↗</text>

<!-- customer transcript -->
<g transform="translate(30 124)">
 <rect width="330" height="140" rx="16" fill="#0A1421" stroke="#30465F"/>
 <text x="17" y="24" fill="#7F93AA" font-family="ui-monospace,monospace" font-size="9">LIVE TRANSCRIPT / STT</text>
 <circle cx="24" cy="50" r="8" fill="#2563EB" fill-opacity=".25" stroke="#60A5FA"/><text x="43" y="54" fill="#DCE7F3" font-family="ui-sans-serif,system-ui" font-size="11">고객: 요금이 너무 많이 나왔어요.</text>
 <circle cx="24" cy="82" r="8" fill="#10B981" fill-opacity=".2" stroke="#34D399"/><text x="43" y="86" fill="#DCE7F3" font-family="ui-sans-serif,system-ui" font-size="11">상담사: 사용 내역부터 확인해보겠습니다.</text>
 <circle cx="24" cy="114" r="8" fill="#2563EB" fill-opacity=".25" stroke="#60A5FA"/><text x="43" y="118" fill="#DCE7F3" font-family="ui-sans-serif,system-ui" font-size="11">고객: 결합 할인도 적용됐나요?</text>
</g>

<!-- copilot suggestions -->
<g transform="translate(382 124)">
 <rect width="270" height="140" rx="16" fill="#0A1421" stroke="#30465F"/>
 <text x="17" y="24" fill="#7F93AA" font-family="ui-monospace,monospace" font-size="9">AI COPILOT</text>
 <rect x="17" y="39" width="236" height="34" rx="10" fill="#2563EB" fill-opacity=".08" stroke="#60A5FA" stroke-opacity=".35"/>
 <text x="29" y="59" fill="#BFDBFE" font-family="ui-sans-serif,system-ui" font-size="10">추천 멘트 · 할인 적용 여부 설명</text>
 <rect x="17" y="81" width="236" height="34" rx="10" fill="#10B981" fill-opacity=".08" stroke="#34D399" stroke-opacity=".35"/>
 <text x="29" y="101" fill="#BBF7D0" font-family="ui-sans-serif,system-ui" font-size="10">마케팅 · 결합 상품 업셀링 제안</text>
 <circle cx="235" cy="20" r="3.5" fill="#22D3EE"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- AI training / backend -->
<g transform="translate(674 124)">
 <rect width="272" height="140" rx="16" fill="#0A1421" stroke="#30465F"/>
 <text x="17" y="24" fill="#7F93AA" font-family="ui-monospace,monospace" font-size="9">SYSTEM MODULES</text>
 <g font-family="ui-monospace,monospace" font-size="9">
  <rect x="17" y="39" width="72" height="30" rx="8" fill="#172033"/><text x="53" y="58" text-anchor="middle" fill="#93C5FD">FRONT</text>
  <rect x="100" y="39" width="72" height="30" rx="8" fill="#13251D"/><text x="136" y="58" text-anchor="middle" fill="#86EFAC">SPRING</text>
  <rect x="183" y="39" width="72" height="30" rx="8" fill="#10232A"/><text x="219" y="58" text-anchor="middle" fill="#67E8F9">FASTAPI</text>
  <rect x="17" y="82" width="112" height="30" rx="8" fill="#15162A"/><text x="73" y="101" text-anchor="middle" fill="#C4B5FD">RAG / QDRANT</text>
  <rect x="140" y="82" width="115" height="30" rx="8" fill="#172033"/><text x="197" y="101" text-anchor="middle" fill="#93C5FD">TRAINING / RP</text>
 </g>
</g>

<rect x="30" y="282" width="920" height="1" fill="#31475E"/>
<g font-family="ui-monospace,monospace" font-size="9"><text x="30" y="303" fill="#91A3B7">ROLE  Full Stack · AI · Backend · Frontend · Infra</text><text x="357" y="303" fill="#A9B8C8">React · Spring Boot · FastAPI · WebSocket · LangChain · Qdrant · AWS S3</text></g>
