 <rect width="229" height="176" rx="16" fill="#0A1421" stroke="#30465F"/>
 <text x="16" y="23" fill="#7F93AA" font-family="ui-monospace,monospace" font-size="9">SERVICE MODULES</text>
 <g font-family="ui-monospace,monospace" font-size="8.7">
  <rect x="16" y="40" width="92" height="30" rx="8" fill="#172033"/><text x="62" y="59" text-anchor="middle" fill="#93C5FD">FRONTEND</text>
  <rect x="121" y="40" width="92" height="30" rx="8" fill="#13251D"/><text x="167" y="59" text-anchor="middle" fill="#86EFAC">SPRING API</text>
  <rect x="16" y="79" width="92" height="30" rx="8" fill="#10232A"/><text x="62" y="98" text-anchor="middle" fill="#67E8F9">FASTAPI AI</text>
  <rect x="121" y="79" width="92" height="30" rx="8" fill="#15162A"/><text x="167" y="98" text-anchor="middle" fill="#C4B5FD">QDRANT</text>
  <rect x="16" y="118" width="92" height="30" rx="8" fill="#151B26"/><text x="62" y="137" text-anchor="middle" fill="#B6C6D8">TRAINING</text>
  <rect x="121" y="118" width="92" height="30" rx="8" fill="#151B26"/><text x="167" y="137" text-anchor="middle" fill="#B6C6D8">ROLE-PLAY</text>
 </g>
 <text x="16" y="164" fill="#90A3B6" font-family="ui-monospace,monospace" font-size="8.2">React · Spring · FastAPI · RAG</text>
</g>

<rect x="28" y="313" width="923" height="1" fill="#31475E"/>
<g font-family="ui-monospace,monospace" font-size="9">
 <text x="28" y="333" fill="#91A3B7">ROLE  Full Stack · AI · Backend · Frontend · Infra</text>
 <text x="365" y="333" fill="#A9B8C8">React → Spring Boot → FastAPI / LangGraph → Qdrant → AWS S3</text>
</g>
