<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="t d">
<title id="t">CS-Navigator</title><desc id="d">Real-time customer-service copilot console with transcript, AI suggestions and architecture routing</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101C"/><stop offset="1" stop-color="#0A1725"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#64748B" stroke-opacity=".045"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="338" rx="20" fill="url(#bg)" stroke="#284D6B" stroke-width="2"/><rect x="1" y="1" width="978" height="338" rx="20" fill="url(#grid)"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
 <text x="28" y="34" fill="#8093A9" font-size="10">AICC / REAL-TIME COPILOT / TRAINING AUTOMATION</text>
 <rect x="850" y="19" width="101" height="24" rx="5" fill="#0A1523" stroke="#22D3EE" stroke-opacity=".4"/>
 <text x="900" y="35" text-anchor="middle" fill="#8FDCEC" font-size="9">PROJECT HUB ↗</text>
</g>
<text x="28" y="78" fill="url(#brand)" font-family="ui-sans-serif,system-ui" font-size="35" font-weight="900">CS-Navigator</text>
<text x="28" y="103" fill="#CAD7E4" font-family="ui-sans-serif,system-ui" font-size="13">Real-time guidance, role-play simulation and AI-assisted training.</text>

<!-- transcript console -->
<g transform="translate(28 122)">
 <rect width="372" height="176" rx="16" fill="#0A1421" stroke="#30465F"/>
 <text x="16" y="23" fill="#7F93AA" font-family="ui-monospace,monospace" font-size="9">LIVE CONVERSATION / STT</text>
 <circle cx="344" cy="19" r="3.5" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
 <g font-family="ui-sans-serif,system-ui" font-size="10.5">
  <rect x="16" y="39" width="340" height="34" rx="9" fill="#111E30"/><circle cx="31" cy="56" r="8" fill="#2563EB" fill-opacity=".25" stroke="#60A5FA"/><text x="46" y="59" fill="#DCE7F3">고객 · 이번 달 요금이 예상보다 높아요.</text>
  <rect x="16" y="80" width="340" height="34" rx="9" fill="#10251F"/><circle cx="31" cy="97" r="8" fill="#10B981" fill-opacity=".2" stroke="#34D399"/><text x="46" y="100" fill="#DCE7F3">상담사 · 사용 내역과 할인 적용을 확인할게요.</text>
  <rect x="16" y="121" width="340" height="34" rx="9" fill="#111E30"/><circle cx="31" cy="138" r="8" fill="#2563EB" fill-opacity=".25" stroke="#60A5FA"/><text x="46" y="141" fill="#DCE7F3">고객 · 결합 상품으로 더 줄일 수 있나요?</text>
 </g>
 <path d="M16 165 C31 158 43 171 58 164 S87 157 102 165 S132 171 148 163 S178 158 195 165 S225 171 242 163 S272 158 290 165 S321 171 356 164" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
</g>

<!-- copilot panel -->
<g transform="translate(420 122)">
 <rect width="282" height="176" rx="16" fill="#0A1421" stroke="#30465F"/>
 <text x="16" y="23" fill="#7F93AA" font-family="ui-monospace,monospace" font-size="9">AI COPILOT / NEXT BEST ACTION</text>
 <rect x="16" y="39" width="250" height="42" rx="10" fill="#2563EB" fill-opacity=".08" stroke="#60A5FA" stroke-opacity=".35"/>
 <text x="28" y="56" fill="#BFDBFE" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">추천 멘트</text>
 <text x="28" y="71" fill="#B7C7DA" font-family="ui-sans-serif,system-ui" font-size="9.5">할인 적용 여부와 청구 내역을 먼저 설명</text>
 <rect x="16" y="89" width="250" height="42" rx="10" fill="#10B981" fill-opacity=".08" stroke="#34D399" stroke-opacity=".35"/>
 <text x="28" y="106" fill="#BBF7D0" font-family="ui-sans-serif,system-ui" font-size="10" font-weight="700">마케팅 제안</text>
 <text x="28" y="121" fill="#B9D4C7" font-family="ui-sans-serif,system-ui" font-size="9.5">결합 상품 / 해지방어 컨텍스트 추천</text>
 <rect x="16" y="140" width="250" height="22" rx="11" fill="#0F211B" stroke="#34D399" stroke-opacity=".28"/>
 <text x="141" y="155" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="9">CONTEXT → GUIDE → ACTION</text>
</g>

<!-- modules -->
