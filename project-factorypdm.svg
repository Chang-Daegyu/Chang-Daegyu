<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="t d">
<title id="t">FactoryPdM</title><desc id="d">Industrial HMI-style predictive-maintenance project visual</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A0F"/><stop offset="1" stop-color="#111722"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2DD4FF"/><stop offset="1" stop-color="#6B7CFF"/></linearGradient>
  <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#94A3B8" stroke-opacity=".045"/></pattern>
  <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="20" fill="#F59E0B" fill-opacity=".55"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="1" y="1" width="978" height="338" rx="18" fill="url(#bg)" stroke="#394452" stroke-width="2"/>
<rect x="1" y="1" width="978" height="338" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="978" height="7" rx="4" fill="url(#hazard)"/>

<!-- top bar -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="28" y="34" fill="#7E8C9F" font-size="10">PLANT MONITOR / ROTATING EQUIPMENT / PREDICTIVE MAINTENANCE</text>
  <circle cx="776" cy="31" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="789" y="35" fill="#91A0B4" font-size="9">PIPELINE ONLINE</text>
  <rect x="867" y="19" width="84" height="24" rx="5" fill="#0D141D" stroke="#2DD4FF" stroke-opacity=".45"/>
  <text x="909" y="35" text-anchor="middle" fill="#7DDCFF" font-size="9">OPEN REPO ↗</text>
</g>

<!-- identity -->
<text x="28" y="78" fill="url(#blue)" font-family="ui-sans-serif,system-ui" font-size="35" font-weight="850">FactoryPdM</text>
<text x="28" y="103" fill="#D2DAE5" font-family="ui-sans-serif,system-ui" font-size="13">Smart Factory · Anomaly Detection · Remaining Useful Life</text>

<!-- motor area -->
<g transform="translate(28 125)">
  <rect width="288" height="160" rx="14" fill="#0A1017" stroke="#313C4A"/>
  <text x="16" y="22" fill="#8190A4" font-family="ui-monospace,monospace" font-size="9">ASSET / MOTOR + PUMP</text>
  <g transform="translate(24 38)">
    <rect x="0" y="27" width="108" height="52" rx="8" fill="#111A24" stroke="#445365"/>
    <path d="M13 27v52M27 27v52M41 27v52M55 27v52M69 27v52M83 27v52M97 27v52" stroke="#273747"/>
    <circle cx="108" cy="53" r="17" fill="#0B131B" stroke="#2DD4FF" stroke-width="2"/>
    <path d="M125 53h36" stroke="#9AA8B8" stroke-width="5"/>
    <circle cx="178" cy="53" r="24" fill="#101923" stroke="#6B7CFF" stroke-width="2"/>
    <circle cx="178" cy="53" r="8" fill="none" stroke="#2DD4FF" stroke-width="2"/>
    <path d="M202 53h27M216 37v32" stroke="#7B8CA0" stroke-width="4"/>
    <circle cx="108" cy="53" r="3" fill="#2DD4FF" filter="url(#glow)"><animate attributeName="r" values="2;4.5;2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="ui-monospace,monospace" font-size="9">
    <text x="18" y="132" fill="#AAB6C5">INPUT</text><text x="64" y="132" fill="#7DDCFF">current · vibration</text>
    <text x="18" y="149" fill="#AAB6C5">MODEL</text><text x="64" y="149" fill="#C4B5FD">XGBoost · LSTM · AutoEncoder</text>
  </g>
</g>

<!-- waveform -->
<g transform="translate(334 125)">
  <rect width="310" height="160" rx="14" fill="#0A1017" stroke="#313C4A"/>
  <text x="16" y="22" fill="#8190A4" font-family="ui-monospace,monospace" font-size="9">LIVE TELEMETRY / STREAM</text>
  <path d="M18 58H292M18 88H292M18 118H292" stroke="#334155" stroke-opacity=".4"/>
  <path d="M18 88 L27 85 L36 92 L45 69 L54 105 L63 76 L72 90 L81 56 L90 109 L99 78 L108 88 L117 72 L126 96 L135 79 L144 88 L153 63 L162 101 L171 76 L180 89 L189 70 L198 99 L207 80 L216 88 L225 59 L234 105 L243 76 L252 90 L261 70 L270 95 L279 84 L292 88" fill="none" stroke="#2DD4FF" stroke-width="2" filter="url(#glow)"/>
  <circle cy="88" r="3" fill="#F59E0B"><animate attributeName="cx" values="18;292;18" dur="4.8s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace,monospace" font-size="9">
    <text x="18" y="139" fill="#AAB6C5">TRANSPORT</text><text x="88" y="139" fill="#7DDCFF">MQTT → Kafka</text>
    <text x="18" y="153" fill="#AAB6C5">STORAGE</text><text x="88" y="153" fill="#9AB7FF">TimescaleDB</text>
  </g>
</g>

<!-- diagnosis -->
<g transform="translate(662 125)">
  <rect width="289" height="160" rx="14" fill="#0A1017" stroke="#313C4A"/>
  <text x="16" y="22" fill="#8190A4" font-family="ui-monospace,monospace" font-size="9">AI DIAGNOSTICS / SERVING</text>
  <g font-family="ui-monospace,monospace" font-size="9">
    <text x="18" y="49" fill="#AAB6C5">ANOMALY DETECTION</text>
    <rect x="18" y="57" width="252" height="8" rx="4" fill="#18212C"/><rect x="18" y="57" width="94" height="8" rx="4" fill="#34D399" fill-opacity=".8"/>
    <text x="18" y="88" fill="#AAB6C5">RUL ESTIMATION</text>
    <rect x="18" y="96" width="252" height="8" rx="4" fill="#18212C"/><rect x="18" y="96" width="181" height="8" rx="4" fill="url(#blue)"/>
    <rect x="18" y="119" width="252" height="25" rx="6" fill="#101823" stroke="#465466"/>
    <text x="31" y="135" fill="#D7E0EB">FastAPI serving → Next.js dashboard</text>
  </g>
</g>

<!-- footer pipeline -->
<rect x="28" y="301" width="923" height="1" fill="#34404E"/>
<g font-family="ui-monospace,monospace" font-size="9">
  <text x="28" y="322" fill="#8B99AC">AI · Frontend · MLOps</text>
  <text x="178" y="322" fill="#B6C1CF">Unity → MQTT → Kafka → TimescaleDB → AI Serving → Dashboard</text>
  <text x="770" y="322" fill="#FCD34D">IITP K-SoftVation · 장려상</text>
</g>
</svg>