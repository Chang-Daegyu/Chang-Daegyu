<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t d">
<title id="t">FactoryPdM</title><desc id="d">Industrial predictive-maintenance HMI for rotating equipment</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B0F"/><stop offset="1" stop-color="#151821"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35D0FF"/><stop offset="1" stop-color="#7C9CFF"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#FCD34D"/></linearGradient>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#64748B" stroke-opacity=".055"/></pattern>
 <pattern id="haz" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="18" fill="#F59E0B" fill-opacity=".8"/></pattern>
 <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="978" height="318" rx="18" fill="url(#bg)" stroke="#3A414E" stroke-width="2"/><rect x="1" y="1" width="978" height="318" rx="18" fill="url(#grid)"/>
<rect x="0" y="0" width="980" height="8" fill="url(#haz)" opacity=".85"/>

<!-- industrial header -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
 <text x="28" y="38" fill="#7F8A9A" font-size="10">PLANT 01 / ROTATING EQUIPMENT / CONDITION MONITORING</text>
 <text x="28" y="79" fill="url(#cyan)" font-size="34" font-weight="800">FactoryPdM</text>
 <text x="28" y="103" fill="#C7D0DC" font-size="12">Smart Factory Predictive Maintenance</text>
 <rect x="780" y="24" width="165" height="31" rx="6" fill="#10151D" stroke="#35D0FF" stroke-opacity=".5"/>
 <circle cx="798" cy="39" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
 <text x="812" y="43" fill="#A8B4C4" font-size="10">OPEN REPOSITORY ↗</text>
</g>

<!-- motor schematic -->
<g transform="translate(35 128)">
 <rect width="255" height="135" rx="14" fill="#0B1016" stroke="#343C49"/>
 <text x="16" y="22" fill="#8492A6" font-family="ui-monospace,monospace" font-size="9">MOTOR / LIVE CONDITION</text>
 <g transform="translate(26 36)">
  <rect x="0" y="18" width="110" height="56" rx="10" fill="#111923" stroke="#35D0FF" stroke-opacity=".55"/>
  <circle cx="55" cy="46" r="25" fill="#0A1118" stroke="#7C9CFF" stroke-width="2"/>
  <circle cx="55" cy="46" r="10" fill="none" stroke="#35D0FF" stroke-width="2"/>
  <path d="M105 46h42" stroke="#9BA9BA" stroke-width="5"/>
  <circle cx="155" cy="46" r="14" fill="#0A1118" stroke="#F59E0B"/>
  <circle cx="55" cy="46" r="3" fill="#35D0FF" filter="url(#gl)"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/></circle>
 </g>
 <text x="18" y="120" fill="#34D399" font-family="ui-monospace,monospace" font-size="10">STATUS  NORMAL</text>
 <text x="160" y="120" fill="#A7B2C1" font-family="ui-monospace,monospace" font-size="10">RUL  82%</text>
</g>

<!-- vibration panel -->
<g transform="translate(312 128)">
 <rect width="300" height="135" rx="14" fill="#0B1016" stroke="#343C49"/>
 <text x="16" y="22" fill="#8492A6" font-family="ui-monospace,monospace" font-size="9">VIBRATION / CURRENT STREAM</text>
 <path d="M18 76H282M18 48H282M18 104H282" stroke="#334155" stroke-opacity=".45"/>
 <path d="M18 78 L34 74 L48 82 L62 60 L75 94 L88 68 L103 78 L116 41 L130 94 L144 74 L158 80 L171 54 L184 85 L198 72 L214 77 L229 58 L244 92 L258 71 L282 78" fill="none" stroke="#35D0FF" stroke-width="2" filter="url(#gl)"/>
 <circle cy="78" r="3" fill="#F59E0B"><animate attributeName="cx" values="18;282;18" dur="4.5s" repeatCount="indefinite"/></circle>
 <text x="18" y="124" fill="#93A4B8" font-family="ui-monospace,monospace" font-size="9">MQTT → Kafka → TimescaleDB</text>
</g>

<!-- AI diagnostics -->
<g transform="translate(634 128)">
 <rect width="311" height="135" rx="14" fill="#0B1016" stroke="#343C49"/>
 <text x="16" y="22" fill="#8492A6" font-family="ui-monospace,monospace" font-size="9">AI DIAGNOSTICS</text>
 <g font-family="ui-monospace,monospace" font-size="10">
  <text x="18" y="52" fill="#A7B2C1">Anomaly score</text><rect x="130" y="42" width="150" height="10" rx="5" fill="#18212C"/><rect x="130" y="42" width="38" height="10" rx="5" fill="#34D399"/>
  <text x="18" y="79" fill="#A7B2C1">RUL forecast</text><rect x="130" y="69" width="150" height="10" rx="5" fill="#18212C"/><rect x="130" y="69" width="123" height="10" rx="5" fill="url(#cyan)"/>
  <text x="18" y="106" fill="#A7B2C1">Alert level</text><rect x="130" y="96" width="70" height="20" rx="10" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".5"/><text x="165" y="110" text-anchor="middle" fill="#86EFAC">NORMAL</text>
 </g>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">
 <text x="28" y="292" fill="#8592A5">ROLE  AI · Frontend · MLOps</text>
 <text x="235" y="292" fill="#AEBAC9">PyTorch · XGBoost · LSTM · FastAPI · Next.js · Docker · Kubernetes</text>
 <text x="775" y="292" fill="#FCD34D">IITP K-SoftVation · 장려상</text>
</g>
</svg>