<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
<title id="title">NEWSBALANCE</title>
<desc id="desc">Political content bias analysis dashboard. Left bias is blue, neutral is white, right bias is red.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060A13"/><stop offset=".5" stop-color="#09111D"/><stop offset="1" stop-color="#12090D"/></linearGradient>
  <linearGradient id="bias" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F87171"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#94A3B8" fill-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="338" rx="18" fill="url(#bg)" stroke="#354155" stroke-width="2"/>
<rect x="1" y="1" width="978" height="338" rx="18" fill="url(#dots)"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="28" y="33" fill="#7E8DA3" font-size="10">MEDIA INTELLIGENCE / POLITICAL CONTENT ANALYSIS / LIVE DEBATE</text>
  <rect x="861" y="18" width="90" height="25" rx="6" fill="#0D1420" stroke="#64748B" stroke-opacity=".5"/>
  <text x="906" y="35" text-anchor="middle" fill="#B3BFCD" font-size="9">OPEN REPO ↗</text>
</g>
<text x="28" y="77" fill="url(#titleGrad)" font-family="ui-sans-serif,system-ui" font-size="35" font-weight="900">NEWSBALANCE</text>
<text x="28" y="101" fill="#D3DBE6" font-family="ui-sans-serif,system-ui" font-size="13">Political content bias analysis · related news comparison · real-time debate</text>

<!-- Bias scale -->
<g transform="translate(28 119)">
  <rect width="924" height="54" rx="12" fill="#0D1420" stroke="#334155"/>
  <text x="15" y="20" fill="#8FA0B7" font-family="ui-monospace,monospace" font-size="9">BIAS SCALE</text>
  <rect x="112" y="18" width="694" height="11" rx="5.5" fill="url(#bias)"/>
  <line x1="459" y1="13" x2="459" y2="35" stroke="#F8FAFC" stroke-width="1.5"/>
  <text x="112" y="46" fill="#93C5FD" font-family="ui-monospace,monospace" font-size="9">-2 LEFT</text>
  <text x="449" y="46" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace,monospace" font-size="9">0 NEUTRAL</text>
  <text x="806" y="46" text-anchor="end" fill="#FCA5A5" font-family="ui-monospace,monospace" font-size="9">+2 RIGHT</text>
</g>

<!-- LEFT / BLUE -->
<g transform="translate(28 190)">
  <rect width="270" height="105" rx="14" fill="#091526" stroke="#2563EB" stroke-opacity=".75"/>
  <text x="15" y="23" fill="#93C5FD" font-family="ui-monospace,monospace" font-size="9">LEFT-LEANING VIEW</text>
  <text x="15" y="46" fill="#DBEAFE" font-family="ui-sans-serif,system-ui" font-size="11">핵심 주장 · 표현 · 강조점</text>
  <text x="15" y="67" fill="#89A1C2" font-family="ui-monospace,monospace" font-size="9">sentence score / keywords / evidence</text>
  <rect x="15" y="81" width="240" height="7" rx="3.5" fill="#101E34"/>
  <rect x="15" y="81" width="168" height="7" rx="3.5" fill="#3B82F6" fill-opacity=".8"/>
</g>

<!-- ENGINE -->
<g transform="translate(319 190)">
  <rect width="342" height="105" rx="14" fill="#0D1420" stroke="#475569"/>
  <text x="15" y="23" fill="#CBD5E1" font-family="ui-monospace,monospace" font-size="9">ANALYSIS ENGINE</text>
  <g transform="translate(15 38)" font-family="ui-monospace,monospace" font-size="8.5" text-anchor="middle">
    <rect width="64" height="34" rx="7" fill="#111827" stroke="#64748B"/><text x="32" y="21" fill="#F8FAFC">YouTube</text>
    <path d="M66 17H86" stroke="#64748B"/><path d="M80 12l8 5-8 5" fill="none" stroke="#64748B"/>
    <rect x="90" width="64" height="34" rx="7" fill="#111827" stroke="#64748B"/><text x="122" y="15" fill="#F8FAFC">Summary</text><text x="122" y="27" fill="#94A3B8">Keywords</text>
    <path d="M156 17H176" stroke="#64748B"/><path d="M170 12l8 5-8 5" fill="none" stroke="#64748B"/>
    <rect x="180" width="64" height="34" rx="7" fill="#111827" stroke="#64748B"/><text x="212" y="15" fill="#F8FAFC">KcBERT</text><text x="212" y="27" fill="#94A3B8">-2..+2</text>
    <path d="M246 17H266" stroke="#64748B"/><path d="M260 12l8 5-8 5" fill="none" stroke="#64748B"/>
    <rect x="270" width="56" height="34" rx="7" fill="#111827" stroke="#64748B"/><text x="298" y="15" fill="#F8FAFC">News</text><text x="298" y="27" fill="#94A3B8">API</text>
  </g>
  <text x="15" y="91" fill="#8FA0B7" font-family="ui-monospace,monospace" font-size="8.5">Transcript → summarize → classify → compare sources</text>
</g>

<!-- RIGHT / RED -->
<g transform="translate(682 190)">
  <rect width="270" height="105" rx="14" fill="#1B0D12" stroke="#DC2626" stroke-opacity=".75"/>
  <text x="15" y="23" fill="#FCA5A5" font-family="ui-monospace,monospace" font-size="9">RIGHT-LEANING VIEW</text>
  <text x="15" y="46" fill="#FEE2E2" font-family="ui-sans-serif,system-ui" font-size="11">핵심 주장 · 표현 · 강조점</text>
  <text x="15" y="67" fill="#A88F99" font-family="ui-monospace,monospace" font-size="9">sentence score / keywords / evidence</text>
  <rect x="15" y="81" width="240" height="7" rx="3.5" fill="#32151E"/>
  <rect x="87" y="81" width="168" height="7" rx="3.5" fill="#EF4444" fill-opacity=".8"/>
</g>

<rect x="28" y="310" width="924" height="1" fill="#334155"/>
<g font-family="ui-monospace,monospace" font-size="9">
  <text x="28" y="330" fill="#A7B2C2">AI · Frontend</text>
  <text x="139" y="330" fill="#8FA0B7">React · TypeScript · Spring Boot · Flask · PyTorch · Elasticsearch · WebSocket</text>
  <text x="760" y="330" fill="#FCD34D">학술대회 금상 · 캡스톤 은상</text>
</g>
</svg>