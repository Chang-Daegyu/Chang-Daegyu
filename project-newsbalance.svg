<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="t d">
<title id="t">NEWSBALANCE</title><desc id="d">Media intelligence board for political content bias analysis and debate</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A13"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
 <linearGradient id="bias" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EF4444"/><stop offset=".5" stop-color="#E5E7EB"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
 <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F87171"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#94A3B8" fill-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="338" rx="18" fill="url(#bg)" stroke="#354155" stroke-width="2"/><rect x="1" y="1" width="978" height="338" rx="18" fill="url(#dots)"/>

<!-- masthead -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
 <text x="28" y="34" fill="#7E8DA3" font-size="10">MEDIA INTELLIGENCE / POLITICAL CONTENT ANALYSIS / LIVE DEBATE</text>
