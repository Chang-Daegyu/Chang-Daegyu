 <text x="908" y="35" text-anchor="middle" fill="#AEB9C8" font-size="9">OPEN REPO ↗</text>
</g>
<text x="28" y="78" fill="url(#title)" font-family="ui-sans-serif,system-ui" font-size="35" font-weight="900">NEWSBALANCE</text>
<text x="28" y="103" fill="#D3DBE6" font-family="ui-sans-serif,system-ui" font-size="13">Compare viewpoints, evidence and context — not just headlines.</text>

