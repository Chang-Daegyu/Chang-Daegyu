<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t d">
<title id="t">NEWSBALANCE</title><desc id="d">Political media analysis board with balanced left and right perspectives</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B14"/><stop offset="1" stop-color="#0A1120"/></linearGradient>
 <linearGradient id="center" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EF4444"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
 <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F87171"/><stop offset=".5" stop-color="#E5E7EB"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
 <pattern id="noise" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#94A3B8" fill-opacity=".06"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="318" rx="18" fill="url(#bg)" stroke="#364152" stroke-width="2"/><rect x="1" y="1" width="978" height="318" rx="18" fill="url(#noise)"/>

<!-- masthead -->
<text x="30" y="37" fill="#8B98AD" font-family="ui-monospace,monospace" font-size="10">MEDIA INTELLIGENCE / POLITICAL CONTENT ANALYSIS</text>
<text x="30" y="78" fill="url(#title)" font-family="ui-sans-serif,system-ui" font-size="34" font-weight="900">NEWSBALANCE</text>
<text x="30" y="102" fill="#C7D0DD" font-family="ui-sans-serif,system-ui" font-size="13">Compare the narrative, not just the headline.</text>
<rect x="780" y="24" width="166" height="31" rx="6" fill="#0D1420" stroke="#64748B" stroke-opacity=".5"/>
<text x="798" y="43" fill="#AEB9C8" font-family="ui-monospace,monospace" font-size="10">OPEN ANALYSIS REPO ↗</text>

<!-- left perspective -->
<g transform="translate(30 125)">
 <rect width="260" height="136" rx="14" fill="#190D13" stroke="#7F1D1D" stroke-opacity=".65"/>
 <text x="16" y="24" fill="#FCA5A5" font-family="ui-monospace,monospace" font-size="10">LEFT / PROGRESSIVE VIEW</text>
 <rect x="16" y="39" width="228" height="12" rx="6" fill="#2B151B"/><rect x="16" y="39" width="178" height="12" rx="6" fill="#EF4444" fill-opacity=".65"/>
 <text x="16" y="71" fill="#E7D7DA" font-family="ui-sans-serif,system-ui" font-size="11">핵심 주장 · 표현 · 강조점</text>
 <text x="16" y="92" fill="#9E8790" font-family="ui-monospace,monospace" font-size="9">sentence bias / keywords / evidence</text>
 <circle cx="214" cy="100" r="20" fill="none" stroke="#EF4444" stroke-opacity=".35"/><text x="214" y="104" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace,monospace" font-size="10">-2</text>
</g>

<!-- center analysis engine -->
<g transform="translate(310 115)">
 <rect width="360" height="156" rx="16" fill="#0D1420" stroke="#475569"/>
 <text x="18" y="25" fill="#CBD5E1" font-family="ui-monospace,monospace" font-size="10">CONTENT ANALYSIS ENGINE</text>
 <g transform="translate(18 42)" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">
  <rect width="72" height="42" rx="8" fill="#111827" stroke="#64748B"/><text x="36" y="19" fill="#F8FAFC">YouTube</text><text x="36" y="32" fill="#94A3B8">Transcript</text>
  <path d="M74 21H98" stroke="#64748B"/><path d="M92 16l8 5-8 5" fill="none" stroke="#64748B"/>
  <rect x="102" width="72" height="42" rx="8" fill="#111827" stroke="#64748B"/><text x="138" y="19" fill="#F8FAFC">Summary</text><text x="138" y="32" fill="#94A3B8">Keywords</text>
  <path d="M176 21H200" stroke="#64748B"/><path d="M194 16l8 5-8 5" fill="none" stroke="#64748B"/>
  <rect x="204" width="72" height="42" rx="8" fill="#111827" stroke="#64748B"/><text x="240" y="19" fill="#F8FAFC">KcBERT</text><text x="240" y="32" fill="#94A3B8">-2 ~ +2</text>
  <path d="M278 21H302" stroke="#64748B"/><path d="M296 16l8 5-8 5" fill="none" stroke="#64748B"/>
  <rect x="306" width="36" height="42" rx="8" fill="#111827" stroke="#64748B"/><text x="324" y="18" fill="#F8FAFC">News</text><text x="324" y="31" fill="#94A3B8">API</text>
 </g>
 <rect x="18" y="104" width="324" height="8" rx="4" fill="#172033"/><rect x="18" y="104" width="162" height="8" rx="4" fill="url(#center)"/>
 <line x1="180" y1="99" x2="180" y2="119" stroke="#F8FAFC" stroke-opacity=".8"/>
 <text x="18" y="137" fill="#FCA5A5" font-family="ui-monospace,monospace" font-size="9">-2 LEFT</text><text x="156" y="137" fill="#E5E7EB" font-family="ui-monospace,monospace" font-size="9">0 CENTER</text><text x="294" y="137" fill="#93C5FD" font-family="ui-monospace,monospace" font-size="9">+2 RIGHT</text>
</g>

<!-- right perspective -->
<g transform="translate(690 125)">
 <rect width="260" height="136" rx="14" fill="#0B1322" stroke="#1D4ED8" stroke-opacity=".65"/>
 <text x="16" y="24" fill="#93C5FD" font-family="ui-monospace,monospace" font-size="10">RIGHT / CONSERVATIVE VIEW</text>
 <rect x="16" y="39" width="228" height="12" rx="6" fill="#111D31"/><rect x="66" y="39" width="178" height="12" rx="6" fill="#3B82F6" fill-opacity=".65"/>
 <text x="16" y="71" fill="#D6DFEE" font-family="ui-sans-serif,system-ui" font-size="11">핵심 주장 · 표현 · 강조점</text>
 <text x="16" y="92" fill="#8595AE" font-family="ui-monospace,monospace" font-size="9">sentence bias / keywords / evidence</text>
 <circle cx="214" cy="100" r="20" fill="none" stroke="#3B82F6" stroke-opacity=".35"/><text x="214" y="104" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace,monospace" font-size="10">+2</text>
</g>

<!-- bottom ticker -->
<rect x="30" y="282" width="920" height="1" fill="#334155"/>
<g font-family="ui-monospace,monospace" font-size="9"><text x="30" y="303" fill="#A7B2C2">AI · Frontend</text><text x="145" y="303" fill="#8FA0B7">React · TypeScript · Spring Boot · Flask · PyTorch · Elasticsearch · WebSocket</text><text x="765" y="303" fill="#FCD34D">학술대회 금상 · 캡스톤 은상</text></g>
</svg>