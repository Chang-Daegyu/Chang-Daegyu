</g>

<rect x="30" y="282" width="920" height="1" fill="#2B4B40"/>
<g font-family="ui-monospace,monospace" font-size="9"><text x="30" y="303" fill="#90A99D">ROLE  AI Modeling · Backend</text><text x="220" y="303" fill="#AFC4B9">React Native · TypeScript · BLE · SQLite · AI Analysis</text><text x="758" y="303" fill="#FCD34D">대상 · 최우수상</text></g>
