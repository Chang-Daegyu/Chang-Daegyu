        <circle cx="24" cy="45" r="2.4"/><circle cx="44" cy="47" r="2.4"/><circle cx="65" cy="49" r="2.4"/>
        <circle cx="24" cy="70" r="2.4"/><circle cx="45" cy="74" r="2.4"/><circle cx="64" cy="72" r="2.4"/>
        <circle cx="31" cy="98" r="2.4"/><circle cx="55" cy="101" r="2.4"/>
        <circle cx="30" cy="125" r="2.4"/><circle cx="55" cy="128" r="2.4"/>
        <circle cx="35" cy="149" r="2.4"/><circle cx="53" cy="151" r="2.4"/><circle cx="45" cy="163" r="2.4"/>
      </g>
      <path d="M24 24 C13 34 10 51 13 70 C16 88 18 100 16 116 C13 139 19 160 33 170 C46 179 64 175 73 163 C81 152 80 136 76 121 C72 107 72 95 77 78 C83 58 82 39 71 29 C60 19 36 17 24 24Z" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.72"/>
      <ellipse cx="29" cy="14" rx="11" ry="15" fill="none" stroke="#38BDF8" stroke-opacity="0.72"/>
      <ellipse cx="45" cy="10" rx="10" ry="14" fill="none" stroke="#38BDF8" stroke-opacity="0.72"/>
      <ellipse cx="60" cy="12" rx="9" ry="13" fill="none" stroke="#38BDF8" stroke-opacity="0.72"/>
      <ellipse cx="73" cy="17" rx="8" ry="11" fill="none" stroke="#38BDF8" stroke-opacity="0.72"/>
      <ellipse cx="84" cy="24" rx="7" ry="9" fill="none" stroke="#38BDF8" stroke-opacity="0.72"/>
    </g>

    <!-- heat scale -->
    <g transform="translate(174 85)" font-family="ui-monospace,monospace">
      <text x="8" y="0" text-anchor="middle" fill="#A8BBC5" font-size="8">HIGH</text>
      <rect x="3" y="10" width="10" height="116" rx="5" fill="url(#heatLegend)"/>
      <text x="8" y="142" text-anchor="middle" fill="#A8BBC5" font-size="8">LOW</text>
    </g>

    <!-- right plantar -->
    <g transform="translate(225 72)">
      <g clip-path="url(#rightFootClip)">
        <rect x="0" y="0" width="92" height="176" fill="url(#blueFoot)"/>
        <ellipse cx="48" cy="52" rx="43" ry="36" fill="url(#warmGreen)" filter="url(#blurHeat)" opacity="0.74"/>
        <ellipse cx="48" cy="52" rx="30" ry="24" fill="url(#hotRed)" filter="url(#blurHeat)" opacity="0.97"/>
        <ellipse cx="63" cy="35" rx="18" ry="17" fill="url(#hotOrange)" filter="url(#blurHeat)" opacity="0.80"/>
        <ellipse cx="42" cy="146" rx="28" ry="29" fill="url(#hotRed)" filter="url(#blurHeat)" opacity="0.91"/>
        <ellipse cx="45" cy="105" rx="22" ry="32" fill="url(#warmGreen)" filter="url(#blurHeat)" opacity="0.46"/>
      </g>
      <g fill="#F8FAFC" stroke="#BFDBFE" stroke-width="0.8">
        <circle cx="64" cy="24" r="2.4"/><circle cx="47" cy="20" r="2.4"/><circle cx="30" cy="25" r="2.4"/>
        <circle cx="68" cy="45" r="2.4"/><circle cx="48" cy="47" r="2.4"/><circle cx="27" cy="49" r="2.4"/>
        <circle cx="68" cy="70" r="2.4"/><circle cx="47" cy="74" r="2.4"/><circle cx="28" cy="72" r="2.4"/>
        <circle cx="61" cy="98" r="2.4"/><circle cx="37" cy="101" r="2.4"/>
        <circle cx="62" cy="125" r="2.4"/><circle cx="37" cy="128" r="2.4"/>
        <circle cx="57" cy="149" r="2.4"/><circle cx="39" cy="151" r="2.4"/><circle cx="47" cy="163" r="2.4"/>
      </g>
      <path d="M68 24 C79 34 82 51 79 70 C76 88 74 100 76 116 C79 139 73 160 59 170 C46 179 28 175 19 163 C11 152 12 136 16 121 C20 107 20 95 15 78 C9 58 10 39 21 29 C32 19 56 17 68 24Z" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.76"/>
      <ellipse cx="63" cy="14" rx="11" ry="15" fill="none" stroke="#818CF8" stroke-opacity="0.76"/>
      <ellipse cx="47" cy="10" rx="10" ry="14" fill="none" stroke="#818CF8" stroke-opacity="0.76"/>
      <ellipse cx="32" cy="12" rx="9" ry="13" fill="none" stroke="#818CF8" stroke-opacity="0.76"/>
      <ellipse cx="19" cy="17" rx="8" ry="11" fill="none" stroke="#818CF8" stroke-opacity="0.76"/>
      <ellipse cx="8" cy="24" rx="7" ry="9" fill="none" stroke="#818CF8" stroke-opacity="0.76"/>
    </g>

    <g transform="translate(18 250)" font-family="ui-monospace,monospace" font-size="8.5">
      <circle cx="4" cy="0" r="3" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="14" y="3" fill="#7FA497">LIVE PRESSURE STREAM</text>
      <text x="343" y="3" text-anchor="end" fill="#607A87">16-CHANNEL FSR</text>
    </g>
  </g>

  <!-- RIGHT ANALYTICS COLUMN -->
  <g transform="translate(628 24)">
    <rect width="324" height="74" rx="15" fill="#08131B" stroke="url(#panelStroke)"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="17" y="23" fill="#8AA3B0" font-size="9">SESSION SIGNAL</text>
      <circle cx="18" cy="47" r="4" fill="#34D399"/>
      <text x="30" y="51" fill="#8FE8BF" font-size="10">BLE L / R CONNECTED</text>
      <text x="307" y="51" text-anchor="end" fill="#6A8996" font-size="9">~20 Hz UI</text>
    </g>

    <g transform="translate(0 90)">
      <rect width="156" height="88" rx="15" fill="#08131B" stroke="url(#panelStroke)"/>
      <text x="15" y="23" fill="#8AA3B0" font-family="ui-monospace,monospace" font-size="9">STRIDE BALANCE</text>
      <text x="16" y="54" fill="#67E8F9" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="800">L</text>
      <rect x="44" y="43" width="93" height="9" rx="4.5" fill="#14242A"/>
      <rect x="44" y="43" width="47" height="9" rx="4.5" fill="#22D3EE"/>
      <rect x="91" y="43" width="46" height="9" rx="4.5" fill="#A78BFA"/>
      <text x="141" y="54" fill="#C4B5FD" text-anchor="end" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="800">R</text>
      <text x="16" y="74" fill="#66838D" font-family="ui-monospace,monospace" font-size="8.5">session averaged pressure</text>
    </g>

    <g transform="translate(168 90)">
      <rect width="156" height="88" rx="15" fill="#08131B" stroke="url(#panelStroke)"/>
      <text x="15" y="23" fill="#8AA3B0" font-family="ui-monospace,monospace" font-size="9">PRESSURE ZONES</text>
      <g font-family="ui-monospace,monospace" font-size="8.5">
        <text x="15" y="45" fill="#9BB1BB">FOREFOOT</text><rect x="76" y="38" width="62" height="6" rx="3" fill="#14242A"/><rect x="76" y="38" width="44" height="6" rx="3" fill="#F97316"/>
        <text x="15" y="61" fill="#9BB1BB">MIDFOOT</text><rect x="76" y="54" width="62" height="6" rx="3" fill="#14242A"/><rect x="76" y="54" width="24" height="6" rx="3" fill="#4ADE80"/>
        <text x="15" y="77" fill="#9BB1BB">HEEL</text><rect x="76" y="70" width="62" height="6" rx="3" fill="#14242A"/><rect x="76" y="70" width="37" height="6" rx="3" fill="#22D3EE"/>
      </g>
    </g>

    <g transform="translate(0 194)">
      <rect width="324" height="84" rx="15" fill="#08131B" stroke="url(#panelStroke)"/>
      <text x="17" y="23" fill="#B9A8EE" font-family="ui-monospace,monospace" font-size="9">AI FEEDBACK</text>
      <circle cx="29" cy="50" r="13" fill="#171526" stroke="#A78BFA" stroke-opacity="0.5"/>
      <path d="M24 51c3-6 7-6 10 0M25 45c2-4 6-4 8 0M29 43v15" fill="none" stroke="#C4B5FD" stroke-width="1.5"/>
      <text x="53" y="45" fill="#D7E2E8" font-family="ui-sans-serif,system-ui" font-size="10.5" font-weight="700">Analyze session pressure pattern</text>
      <text x="53" y="63" fill="#77909B" font-family="ui-monospace,monospace" font-size="8.5">heatmap · feedback · taping / recovery guidance</text>
      <rect x="245" y="35" width="61" height="26" rx="13" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.36"/>
      <text x="275.5" y="52" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="9">ANALYZE</text>
