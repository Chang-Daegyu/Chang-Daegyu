  <!-- BOTTOM PIPELINE -->
  <g transform="translate(247 315)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5">
    <rect x="0" y="0" width="705" height="24" rx="8" fill="#071116" stroke="#1D3C3B"/>
    <text x="18" y="15" fill="#8DE8C0">SMART INSOLE</text>
    <text x="111" y="15" fill="#456A66">→</text>
    <text x="136" y="15" fill="#7DDFF0">BLE</text>
    <text x="177" y="15" fill="#456A66">→</text>
    <text x="202" y="15" fill="#D1DDE3">FSR PROCESSING</text>
    <text x="306" y="15" fill="#456A66">→</text>
    <text x="331" y="15" fill="#7DDFF0">LIVE PRESSURE</text>
    <text x="423" y="15" fill="#456A66">→</text>
    <text x="448" y="15" fill="#86EFAC">SESSION</text>
    <text x="504" y="15" fill="#456A66">→</text>
    <text x="529" y="15" fill="#C4B5FD">AI FEEDBACK</text>
    <rect x="622" y="3" width="74" height="18" rx="5" fill="#0B1E1B" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="659" y="15" text-anchor="middle" fill="#8CE8C0">OPEN REPO ↗</text>
  </g>
</svg>