<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t d">
<title id="t">TapeRunner</title><desc id="d">Sports biometrics dashboard for smart-insole running healthcare</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06110D"/><stop offset="1" stop-color="#071914"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
 <radialGradient id="hot"><stop offset="0" stop-color="#FDE047"/><stop offset=".35" stop-color="#FB923C"/><stop offset=".7" stop-color="#EF4444"/><stop offset="1" stop-color="#34D399" stop-opacity=".15"/></radialGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#5F7A70" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="318" rx="20" fill="url(#bg)" stroke="#235F4D" stroke-width="2"/><rect x="1" y="1" width="978" height="318" rx="20" fill="url(#grid)"/>

<text x="30" y="38" fill="#789386" font-family="ui-monospace,monospace" font-size="10">SPORTS BIOMETRICS / SMART INSOLE / RUNNING ANALYSIS</text>
<text x="30" y="79" fill="url(#mint)" font-family="ui-sans-serif,system-ui" font-size="34" font-weight="900">TapeRunner</text>
<text x="30" y="103" fill="#CFE1D8" font-family="ui-sans-serif,system-ui" font-size="13">Turn plantar-pressure data into running feedback.</text>
<rect x="784" y="24" width="162" height="31" rx="16" fill="#0B1813" stroke="#34D399" stroke-opacity=".45"/>
<text x="803" y="43" fill="#8CE6BF" font-family="ui-monospace,monospace" font-size="10">OPEN RUNNING REPO ↗</text>

<!-- foot pressure map -->
<g transform="translate(34 125)">
 <rect width="310" height="138" rx="18" fill="#0A1511" stroke="#295746"/>
 <text x="18" y="24" fill="#7EA394" font-family="ui-monospace,monospace" font-size="9">LIVE FOOT PRESSURE / L + R</text>
 <g transform="translate(44 33)">
  <path d="M42 0 C20 5 12 27 17 51 C22 76 20 94 31 104 C44 116 62 103 61 85 C60 65 67 50 65 31 C63 12 55 -2 42 0Z" fill="#0D211A" stroke="#34D399" stroke-opacity=".45"/>
  <circle cx="43" cy="22" r="16" fill="url(#hot)" opacity=".9"/><circle cx="33" cy="55" r="13" fill="url(#hot)" opacity=".75"/><circle cx="49" cy="82" r="14" fill="url(#hot)" opacity=".8"/>
 </g>
 <g transform="translate(177 33)">
  <path d="M42 0 C20 5 12 27 17 51 C22 76 20 94 31 104 C44 116 62 103 61 85 C60 65 67 50 65 31 C63 12 55 -2 42 0Z" fill="#0D211A" stroke="#22D3EE" stroke-opacity=".45"/>
  <circle cx="44" cy="20" r="15" fill="url(#hot)" opacity=".8"/><circle cx="38" cy="58" r="12" fill="url(#hot)" opacity=".65"/><circle cx="51" cy="84" r="13" fill="url(#hot)" opacity=".72"/>
 </g>
</g>

<!-- session metrics -->
<g transform="translate(366 125)">
 <rect width="254" height="138" rx="18" fill="#0A1511" stroke="#295746"/>
 <text x="18" y="24" fill="#7EA394" font-family="ui-monospace,monospace" font-size="9">RUN SESSION</text>
 <g font-family="ui-monospace,monospace">
  <text x="18" y="56" fill="#DCEAE3" font-size="11">BLE L / R</text><text x="219" y="56" text-anchor="end" fill="#86EFAC" font-size="11">CONNECTED</text>
  <text x="18" y="80" fill="#DCEAE3" font-size="11">Sensor input</text><text x="219" y="80" text-anchor="end" fill="#67E8F9" font-size="11">16-ch FSR</text>
  <text x="18" y="104" fill="#DCEAE3" font-size="11">UI refresh</text><text x="219" y="104" text-anchor="end" fill="#86EFAC" font-size="11">~20 Hz</text>
 </g>
 <rect x="18" y="118" width="200" height="6" rx="3" fill="#14251D"/><rect x="18" y="118" width="152" height="6" rx="3" fill="url(#mint)"/>
</g>

<!-- ai coach -->
<g transform="translate(642 125)">
 <rect width="304" height="138" rx="18" fill="#0A1511" stroke="#295746"/>
 <text x="18" y="24" fill="#7EA394" font-family="ui-monospace,monospace" font-size="9">AI RUNNING COACH</text>
 <text x="18" y="53" fill="#E1EFE8" font-family="ui-sans-serif,system-ui" font-size="12" font-weight="700">Pressure balance → session analysis</text>
