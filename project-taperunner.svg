<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img" aria-labelledby="title desc">
  <title id="title">TapeRunner — Smart Insole AI Running Healthcare</title>
  <desc id="desc">Professional plantar-pressure heatmap dashboard for TapeRunner with BLE smart insole, FSR sensor stream, session analysis, and AI feedback.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B10"/>
      <stop offset="0.56" stop-color="#07131A"/>
      <stop offset="1" stop-color="#06110E"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="blueFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123B8A"/>
      <stop offset="0.52" stop-color="#0B69B7"/>
      <stop offset="1" stop-color="#0A2F70"/>
    </linearGradient>
    <linearGradient id="heatLegend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="0.23" stop-color="#F97316"/>
      <stop offset="0.46" stop-color="#FACC15"/>
      <stop offset="0.68" stop-color="#4ADE80"/>
      <stop offset="0.83" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="hotRed">
      <stop offset="0" stop-color="#FFF7A8"/>
      <stop offset="0.18" stop-color="#FDE047"/>
      <stop offset="0.43" stop-color="#FB923C"/>
      <stop offset="0.67" stop-color="#EF4444" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hotOrange">
      <stop offset="0" stop-color="#FFF9C4"/>
      <stop offset="0.22" stop-color="#FDE047"/>
      <stop offset="0.52" stop-color="#F97316" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGreen">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="0.35" stop-color="#4ADE80" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#22D3EE" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#244356"/>
      <stop offset="1" stop-color="#18362E"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#6B8291" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurHeat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Anatomical left plantar silhouette, normalized around x=0..92 / y=0..174 -->
    <clipPath id="leftFootClip">
      <ellipse cx="29" cy="14" rx="11" ry="15"/>
      <ellipse cx="45" cy="10" rx="10" ry="14"/>
      <ellipse cx="60" cy="12" rx="9" ry="13"/>
      <ellipse cx="73" cy="17" rx="8" ry="11"/>
      <ellipse cx="84" cy="24" rx="7" ry="9"/>
      <path d="M24 24 C13 34 10 51 13 70 C16 88 18 100 16 116 C13 139 19 160 33 170 C46 179 64 175 73 163 C81 152 80 136 76 121 C72 107 72 95 77 78 C83 58 82 39 71 29 C60 19 36 17 24 24Z"/>
    </clipPath>
    <clipPath id="rightFootClip">
      <ellipse cx="63" cy="14" rx="11" ry="15"/>
      <ellipse cx="47" cy="10" rx="10" ry="14"/>
      <ellipse cx="32" cy="12" rx="9" ry="13"/>
      <ellipse cx="19" cy="17" rx="8" ry="11"/>
      <ellipse cx="8" cy="24" rx="7" ry="9"/>
      <path d="M68 24 C79 34 82 51 79 70 C76 88 74 100 76 116 C79 139 73 160 59 170 C46 179 28 175 19 163 C11 152 12 136 16 121 C20 107 20 95 15 78 C9 58 10 39 21 29 C32 19 56 17 68 24Z"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="978" height="348" rx="20" fill="url(#bg)" stroke="#203C48" stroke-width="2"/>
  <rect x="1" y="1" width="978" height="348" rx="20" fill="url(#grid)"/>

  <!-- LEFT BRAND / PRODUCT COLUMN -->
  <g transform="translate(28 24)">
    <text x="0" y="38" fill="url(#brand)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="37" font-style="italic" font-weight="900">TapeRunner</text>
    <text x="2" y="63" fill="#A7BBC7" font-family="ui-sans-serif,system-ui" font-size="13">Smart Insole AI Running Healthcare</text>
    <rect x="0" y="78" width="204" height="1" fill="#204B43"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">
      <rect x="0" y="95" width="92" height="24" rx="12" fill="#123029" stroke="#34D399" stroke-opacity="0.34"/>
      <text x="46" y="111" text-anchor="middle" fill="#8CE8C0">AI MODELING</text>
      <rect x="100" y="95" width="86" height="24" rx="12" fill="#102932" stroke="#22D3EE" stroke-opacity="0.34"/>
      <text x="143" y="111" text-anchor="middle" fill="#7DDFF0">BACKEND</text>
    </g>

    <g transform="translate(0 137)" font-family="ui-sans-serif,system-ui">
      <circle cx="15" cy="15" r="14" fill="#0B201B" stroke="#34D399" stroke-opacity="0.45"/>
      <path d="M8 19 C12 13 14 7 21 6 C24 8 24 13 20 16 C17 18 14 21 12 24" fill="none" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round"/>
      <text x="40" y="12" fill="#D7E4DE" font-size="11" font-weight="700">Dual Smart Insole</text>
      <text x="40" y="27" fill="#789A8A" font-size="9">Left / right BLE streams</text>

      <circle cx="15" cy="58" r="14" fill="#0B1C23" stroke="#22D3EE" stroke-opacity="0.45"/>
      <path d="M10 63h10M15 53v10M8 58h14" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
      <text x="40" y="55" fill="#D7E4DE" font-size="11" font-weight="700">Pressure Processing</text>
      <text x="40" y="70" fill="#789A8A" font-size="9">Normalize · filter · map</text>

      <circle cx="15" cy="101" r="14" fill="#171426" stroke="#A78BFA" stroke-opacity="0.45"/>
      <path d="M10 102c3-6 7-6 10 0M11 96c2-4 6-4 8 0M15 93v15" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
      <text x="40" y="98" fill="#D7E4DE" font-size="11" font-weight="700">AI Session Feedback</text>
      <text x="40" y="113" fill="#789A8A" font-size="9">Heatmap · analysis · guidance</text>
    </g>

    <g transform="translate(0 276)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">
      <rect width="203" height="27" rx="7" fill="#0C1719" stroke="#2C524B"/>
      <circle cx="14" cy="13.5" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.55s" repeatCount="indefinite"/></circle>
      <text x="27" y="17" fill="#8FE9C2">BLE CONNECTED</text>
      <text x="188" y="17" text-anchor="end" fill="#6B8A7C">L / R</text>
    </g>
  </g>

  <!-- CENTER PLANTAR HEATMAP PANEL -->
  <g transform="translate(247 24)">
    <rect width="363" height="277" rx="16" fill="#08131B" stroke="url(#panelStroke)"/>
    <text x="18" y="25" fill="#C8D5DE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700">PLANTAR PRESSURE HEATMAP</text>
    <text x="18" y="43" fill="#668797" font-family="ui-monospace,monospace" font-size="8">REAL-TIME FSR DISTRIBUTION</text>

    <text x="66" y="65" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace,monospace" font-size="9">LEFT</text>
    <text x="260" y="65" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace,monospace" font-size="9">RIGHT</text>

    <!-- left plantar -->
    <g transform="translate(40 72)">
      <g clip-path="url(#leftFootClip)">
        <rect x="0" y="0" width="92" height="176" fill="url(#blueFoot)"/>
        <ellipse cx="44" cy="52" rx="43" ry="36" fill="url(#warmGreen)" filter="url(#blurHeat)" opacity="0.74"/>
        <ellipse cx="44" cy="51" rx="29" ry="24" fill="url(#hotRed)" filter="url(#blurHeat)" opacity="0.98"/>
        <ellipse cx="31" cy="35" rx="18" ry="17" fill="url(#hotOrange)" filter="url(#blurHeat)" opacity="0.82"/>
        <ellipse cx="51" cy="146" rx="29" ry="29" fill="url(#hotRed)" filter="url(#blurHeat)" opacity="0.90"/>
        <ellipse cx="47" cy="104" rx="22" ry="33" fill="url(#warmGreen)" filter="url(#blurHeat)" opacity="0.47"/>
      </g>
      <g fill="#F8FAFC" stroke="#A7F3D0" stroke-width="0.8">
